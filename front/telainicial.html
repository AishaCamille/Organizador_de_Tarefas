<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organize-se!</title>
        <link rel="icon" href="imagens/e8f17830a5f55201718fa320a036ae06-removebg-preview.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="telainicial.css">
    <link rel="stylesheet" href="telainicialTarefas.css">
    <link rel="stylesheet" href="telainicialTarefasConcluidas.css">
</head>

<body>

    <nav>
        
        <button class="nav_arrow left" id="arrowLeft">&lt;</button>
        
        <div class="nav-wrapper" id="navWrapper">
            <ul>
                <li><a href="#" onclick="mudarPagina(0)">Tarefas</a></li>
                <li><a href="#" onclick="mudarPagina(1)">Tarefas Concluídas</a></li>
                <li><a href="#" onclick="mudarPagina(2)">Tempo nas tarefas</a></li>
                <li><a href="#" onclick="mudarPagina(3)">Ranking</a></li>
                <li><a href="#" onclick="mudarPagina(4)">Pomodoro</a></li>
                <li><a href="#" onclick="mudarPagina(5)">Perfil</a></li>
            </ul>
        </div>

        <button class="nav_arrow right" id="arrowRight">&gt;</button>

    </nav>

    <main>

        <div class="container">
            
            <section class="pagina Tarefa"> <!--0-->
                <h3 class="titulotarefas">Aqui estão estão suas tarefas Pendentes!</h3>
                <div class="TarefasAdc">
                    <div class="conteudotarefas">
                        <label class="textolabel" for="tarefa">Tarefas para hoje?</label>
                        <input type="text" class="tarefa" id="tarefa">

                        
                    </div>
                    <div class="form_floarting">
                        <select name="prioridade" id="prioridade" class="seletor">
                            <option value="Urgente">Urgente</option>
                            <option value="Alta">Alta</option>
                            <option value="Média" selected>Média</option>
                            <option value="Baixa">Baixa</option>
                        </select>
                    </div>
                </div>
                <!--area das prioridades-->
                <div class="container_prioridade">

                    <!-- Caixa Urgente -->
                    <div class="caixa-prioridade urgente">
                        <h4 class="titulo-prioridade">Urgente</h4>
                        <ul id="listaUrgente"></ul>
                    </div>

                    <!-- Caixa Alta -->
                    <div class="caixa-prioridade alta">
                        <h4 class="titulo-prioridade">Alta</h4>
                        <ul id="listaAlta"></ul>
                    </div>

                    <!-- Caixa Média -->
                    <div class="caixa-prioridade media">
                        <h4 class="titulo-prioridade">Média</h4>
                        <ul id="listaMedia"></ul>
                    </div>

                    <!-- Caixa Baixa -->
                    <div class="caixa-prioridade baixa">
                        <h4 class="titulo-prioridade">Baixa</h4>
                        <ul id="listaBaixa"></ul>
                    </div>

            </section>

            <section class="pagina TarefasConcluidas"> <!--1-->
                <div class="titulotarefasConcluidasDiv">
                    <h3 class="titulotarefasConcluidas" >Tarefas Completadas!</h3>
                </div>
                <div class="layout-concluidas">
                    <div class="tarefaspendentes">
                        <!--lista das tarefas concluidas-->
                        <ul id="listaConcluidas"></ul>
                    </div>
                    <!--gif-->
                    <div class="container-gif">
                        <img src="https://media.tenor.com/DpJdyKQKgYkAAAAm/cat-jump.webp" alt="Gatinho comemorando" class="gif-comemorativo">
                    </div>
                </div>
            </section>


            <section class="pagina TempoTarefas"> <!--3-->
                
            </section>

            <section class="pagina Ranking"> <!--4-->
                
            </section>
            
            <section class="pagina Pomodoro"> <!--5-->
              
            </section>

            <section class="pagina Perfil"> <!--6-->
                
            </section>
            


        </div>

    </main>

    <script src="telainicial.js"></script>

</body>

</html>
